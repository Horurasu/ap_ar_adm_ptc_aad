<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora de Sanitarios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--app:#eeece5;--paper:#f7f5f0;--line:#e5e0d3;--ink:#2b2b28;--soft:#6b6660;--navy:#083863}
*{box-sizing:border-box}
body{margin:0;background:var(--app);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--app);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marca{display:flex;align-items:center;gap:12px;cursor:pointer}
.marca img{height:46px}
h1{font-size:19px;margin:0}
h2{font-size:18px;margin:0 0 6px}
.sub{color:var(--soft);font-size:13px}
main{padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font:inherit;font-weight:700;font-size:14px;border:0;border-bottom:4px solid rgba(0,0,0,.25);box-shadow:0 3px 6px rgba(0,0,0,.12);cursor:pointer;color:#fff;transition:all .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 14px rgba(0,0,0,.14)}
.btn:active{transform:translateY(1px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.verde{background:linear-gradient(135deg,#34d399,#059669)}
.azul{background:linear-gradient(135deg,#38bdf8,#2563eb)}
.morado{background:linear-gradient(135deg,#818cf8,#4f46e5)}
.ambar{background:linear-gradient(135deg,#fbbf24,#f97316)}
.rojo{background:linear-gradient(135deg,#f87171,#dc2626)}
.blanco{background:#fff;color:var(--ink);border:1px solid var(--line);border-bottom:4px solid var(--line)}
.sm{padding:5px 10px;font-size:12.5px;border-bottom-width:3px;border-radius:10px}
.grande{padding:15px 26px;font-size:17px;border-radius:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#10b981;box-shadow:0 0 0 3px #d1fae5}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.muted{color:var(--soft)}.small{font-size:12.5px}
.hola{text-align:center;margin:5vh 0 26px}
.hola h2{font-size:26px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;max-width:760px;margin:0 auto}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:30px 24px;min-height:220px;border-radius:24px;border:0;border-bottom:7px solid rgba(0,0,0,.25);box-shadow:0 8px 18px rgba(0,0,0,.15);color:#fff;font:inherit;cursor:pointer;transition:all .15s}
.mbtn:hover{transform:translateY(-4px);box-shadow:0 16px 28px rgba(0,0,0,.2)}
.mbtn:active{transform:translateY(2px);border-bottom-width:3px}
.mbtn .ic{font-size:54px;line-height:1}
.mbtn b{font-size:23px}
.mbtn span{font-size:14.5px;opacity:.95}
.mbtn .cnt{background:rgba(255,255,255,.25);padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px}
.debajo{text-align:center;margin-top:34px}
.paso{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin:4px 0 10px}
.paso .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.paso small{font-weight:400;color:var(--soft)}
.bloque+.bloque{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.semana{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.semtxt{min-width:230px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
.semtxt b{display:block;font-size:20px}
.letras{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.letra{min-width:62px;height:62px;padding:0 12px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:#fff;font:inherit;font-size:26px;font-weight:800;color:var(--ink);cursor:pointer;transition:all .12s}
.letra:hover{transform:translateY(-2px);border-color:#6ee7b7}
.letra.on{background:#059669;border-color:#047857;color:#fff}
.letra.piso{font-size:20px}
.otro{display:flex;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:16px;padding:6px 8px;height:62px}
.otro input{width:120px;font-size:18px;font-weight:800;text-transform:uppercase;padding:8px}
.otro.on{border-color:#059669;background:#ecfdf5}
.ruta{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--paper);border:1px dashed #cfc8b6;border-radius:10px;padding:7px 9px;word-break:break-all;display:flex;justify-content:space-between;gap:8px;align-items:center;margin:5px 0}
.ruta button{flex-shrink:0}
.ruta .car{color:var(--soft)}
.ruta .arc{font-weight:800;color:var(--ink)}
.pie-gen{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.editando{background:#fffbeb;border:2px solid #fbbf24;border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:12px;text-transform:uppercase;color:var(--soft);letter-spacing:.03em}
.scroll{overflow-x:auto}
code.nom{font-size:12px;word-break:break-all}
.filtros{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin:10px 0}
@media (max-width:700px){.filtros{grid-template-columns:1fr 1fr}}
#modal{position:fixed;inset:0;background:rgba(20,20,18,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:24px;max-width:680px;width:100%;padding:24px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox .ok{font-size:44px;text-align:center}
.mbox h2{text-align:center;font-size:22px}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.abtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:18px;border:0;border-bottom:5px solid rgba(0,0,0,.25);font:inherit;color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:all .15s}
.abtn:hover{transform:translateY(-3px)}
.abtn:active{transform:translateY(1px);border-bottom-width:2px}
.abtn span{font-size:32px;line-height:1}
.abtn b{font-size:15.5px}
.abtn.blanco{color:var(--ink)}
.cancelar{display:block;margin:16px auto 0;background:none;border:0;color:#b91c1c;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:underline}
@media (max-width:560px){.acciones{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2b28;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:40;max-width:90vw}
#print{display:none}
#pdfzone{position:fixed;left:-20000px;top:0;background:#fff}
.logos-cfg{display:flex;gap:18px;flex-wrap:wrap}
.logos-cfg div{text-align:center}
.logos-cfg img{height:70px;max-width:280px;object-fit:contain;display:block;margin:0 auto 6px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}

/* ===== HOJA IMPRESA ===== */
.hj{background:#fff;color:#000;font:9pt/1.2 Arial,Helvetica,sans-serif;width:261mm;page-break-after:always;break-after:page}
.hj:last-child{page-break-after:auto;break-after:auto}
.mb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4mm;margin-bottom:2.5mm}
.mb img{height:14mm;width:auto;justify-self:start}
.mbt{text-align:center;line-height:1.2}
.mbt span{display:block;font-size:10.5pt;font-weight:700}
.mbt b{display:block;font-size:14pt}
.fol{justify-self:end;border:1.6px solid #000;border-radius:2mm;padding:1mm 3mm;text-align:center;line-height:1.15}
.fol small{display:block;font-size:6.5pt;font-weight:700}
.fol b{display:block;font-family:"Courier New",monospace;font-size:11.5pt}
.fol i{display:block;font-style:normal;font-size:7pt;font-weight:700;background:#000;color:#fff;border-radius:1mm;margin-top:.5mm;padding:0 1mm}
.cajas{display:flex;gap:3mm;margin-bottom:2.5mm}
.caja{border:1.6px solid #000;border-radius:2mm;padding:1mm 4mm;display:flex;align-items:center;gap:3mm;min-width:38mm}
.caja small{font-size:7.5pt;font-weight:700;letter-spacing:.3px}
.caja b{font-size:18pt;line-height:1}
.caja span{font-size:9pt}
.caja.w{flex:1}
.tb{width:100%;border-collapse:collapse;table-layout:fixed}
.tb th,.tb td{border:1px solid #000;padding:1px 2px;text-align:center;font-size:7.6pt}
.tb th{font-weight:700}
.tb th.rb{font-size:5.9pt;line-height:1.1;padding:1px 0}
.html2pdf__page-break{background:#fff}
.tb td{height:11.4mm}
.tb td.dia{font-weight:700;font-size:8pt}
.tb td.dia small{display:block;font-weight:400;font-size:7pt}
.tb td.tur{font-weight:700}
.tb .cp{background:#fff4c2}
.ley{font-size:7.5pt;margin-top:1mm;color:#333}
.fr{margin-top:5mm;display:grid;grid-template-columns:auto 1fr;gap:4.5mm 6mm;max-width:200mm;font-weight:700;font-size:9pt;align-items:end}
.fr i{font-style:normal;font-weight:400;border-bottom:1px solid #000;min-height:5mm;padding-left:2mm}
.h2sec{font-weight:800;font-size:11pt;margin:3mm 0 1mm;padding:1.2mm 2.5mm;border:1.6px solid #000;border-radius:1.5mm}
.h2sec.cp{background:#fff4c2}
.h2sec small{font-weight:400;font-size:8pt}
.t2{width:100%;border-collapse:collapse}
.t2 th,.t2 td{border:1px solid #000;padding:1mm 2mm;font-size:8.8pt}
.t2 th{background:#eee;font-size:8pt}
.t2 td{height:8.8mm}
.t2 td.q{background:#fff9e0}
.chk{display:inline-block;width:3.2mm;height:3.2mm;border:1px solid #000;margin:0 1mm -.6mm 3mm}
@media print{
  @page{size:letter landscape;margin:0}
  body{background:#fff}
  header,main,#toast,#modal{display:none!important}
  #print{display:block}
  #print .hj{width:auto;padding:9mm 9mm 0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

/* ================= DATOS ================= */
const KEY='bitsan_v2',CFG_VER=3;
const DEF_CONFIG={
  encabezado:'MANTENIMIENTO',
  encMat:'',encVes:'',supervisor:'',
  edificios:['A','B','C','D','E','F','G'],
  pisos:['PB','P1','P2','P3'],
  rubros:[['Limpieza sanitarios',false],['Servicio de agua',false],['Despachador manos',true],['Despachador sanitarios',true],['Jabón',true],['Botes de basura',true],['Lavabo y espejos',false]],
  hoja2:true,
  insumos:[['Papel higiénico','rollos'],['Jabón para manos','litros'],['Toalla para manos','paquetes']],
  filasOtro:5,filasInc:5,
  logoMembrete:'',logoEscudo:''
};
const DIAS=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES'];
const MES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l)=>String(n).padStart(l,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
const parseISO=s=>{const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>{if(!s)return '';const d=typeof s==='string'?(s.length>10?new Date(s):parseISO(s)):s;return `${pad(d.getDate(),2)}/${pad(d.getMonth()+1,2)}/${d.getFullYear()}`};
const fmtLargo=d=>`${d.getDate()} de ${MESES[d.getMonth()]}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
const normEd=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim().replace(/\s+/g,'-').replace(/[^A-Z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');
function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,ms)}
function copiar(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copiado ✔'),()=>prompt('Copia el texto:',txt))}

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.docs)){
    s.config={...structuredClone(DEF_CONFIG),...s.config};
    if((s.cfgVer||0)<CFG_VER){s.config.insumos=structuredClone(DEF_CONFIG.insumos);delete s.config.logoIzq;delete s.config.logoDer;s.cfgVer=CFG_VER}
    return s}}catch(e){}
  return{config:structuredClone(DEF_CONFIG),consec:0,docs:[],dirty:false,cfgVer:CFG_VER}
}
let S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar (¿logo muy pesado?)')}}
function save(){S.dirty=true;persist()}
const C=()=>S.config;
const logoMem=()=>C().logoMembrete||LOGO_MEMBRETE;
const logoEsc=()=>C().logoEscudo||LOGO_ESCUDO;

/* ===== nomenclatura ===== */
const archivo=d=>`${d.folio}_ED${d.edificio}-${d.piso}_S${pad(d.semana,2)}${d.edicion?`_EDITADA-${d.edicion}`:''}.pdf`;
const carpeta=d=>`BITACORAS-SANITARIOS/${d.lunes.slice(0,4)}/${d.mesCarpeta}/EDIF-${d.edificio}/`;
const mesCarpeta=d=>`${d.getFullYear()}-${pad(d.getMonth()+1,2)}_${MES3[d.getMonth()]}`;
const rutaHTML=d=>`<div class="ruta"><span><span class="car">${esc(carpeta(d))}</span><span class="arc">${esc(archivo(d))}</span></span><button class="btn blanco sm" data-t="${esc(carpeta(d)+archivo(d))}" onclick="copiar(this.dataset.t)">📋 Copiar</button></div>`;

/* ================= NAVEGACIÓN ================= */
let VISTA='inicio';
function ir(v){VISTA=v;render();window.scrollTo(0,0)}
function render(){
  $('hlogo').src=logoEsc();
  $('volver').innerHTML=VISTA==='inicio'?'':`<button class="btn blanco" onclick="ir('inicio')">🏠 Inicio</button>`;
  $('view').innerHTML={inicio:vInicio,generar:vGenerar,registro:vRegistro,config:vConfig}[VISTA]();
  if(VISTA==='registro')pintarTabla();
  if(VISTA==='generar')pintarPrev();
}
const doc=id=>S.docs.find(x=>x.id===id);

/* ================= INICIO ================= */
function vInicio(){
  return `<div class="hola"><h2>¿Qué quieres hacer?</h2></div>
  <div class="menu">
    <button class="mbtn verde" onclick="G=null;ir('generar')"><span class="ic">📝</span><b>Generar bitácora</b><span>Elige semana, edificio y piso. Lista en segundos.</span></button>
    <button class="mbtn morado" onclick="ir('registro')"><span class="ic">📋</span><b>Bitácoras generadas</b><span>Buscar, reimprimir, volver a guardar o editar.</span><span class="cnt">${S.docs.length} en el registro</span></button>
  </div>
  <div class="debajo"><button class="btn blanco" onclick="ir('config')">⚙️ Configuración y respaldo</button>${S.dirty&&S.docs.length?`<div class="small" style="color:#b45309;margin-top:8px">⚠️ Hay cambios sin respaldar en Excel</div>`:''}</div>`;
}

/* ================= GENERAR / EDITAR ================= */
let G=null;
function nuevoG(){return{lunes:toISO(monday(new Date())),ed:null,pisos:[],editId:null}}
function vGenerar(){
  const c=C();if(!G)G=nuevoG();
  const lun=parseISO(G.lunes),vie=addDays(lun,4),w=isoWeek(lun).w,hoy=toISO(monday(new Date()));
  const ed=G.editId?doc(G.editId):null;
  const otro=G.ed&&!c.edificios.includes(G.ed)?G.ed:'';
  return `${ed?`<div class="editando"><span>✏️ <b>Editando ${ed.folio}</b> — al guardar, el archivo llevará <b>_EDITADA-${(ed.edicion||0)+1}</b> y esa será la versión buena.</span><button class="btn blanco sm" onclick="G=null;ir('registro')">Salir sin editar</button></div>`:''}
  <div class="card">
    <div class="bloque"><div class="paso"><span class="n">1</span>Semana</div>
      <div class="semana"><button class="btn blanco" onclick="movSem(-7)" title="Semana anterior">◀</button>
      <div class="semtxt"><b>Semana ${w}</b><span class="small">lunes ${fmtLargo(lun)} al viernes ${fmtLargo(vie)} ${vie.getFullYear()}</span></div>
      <button class="btn blanco" onclick="movSem(7)" title="Semana siguiente">▶</button>
      ${G.lunes!==hoy?`<button class="btn blanco sm" onclick="G.lunes='${hoy}';render()">Volver a esta semana</button>`:'<span class="small muted">(semana actual)</span>'}</div></div>
    <div class="bloque"><div class="paso"><span class="n">2</span>Edificio</div>

      ${ed?'':`<button class="letra piso" style="font-size:15px" onclick="G.pisos=G.pisos.length===C().pisos.length?[]:[...C().pisos];render()">${G.pisos.length===c.pisos.length?'Ninguno':'Todos'}</button>`}</div></div>
  </div>

function pintarPrev(){
  const listo=G.ed&&G.pisos.length,ed=G.editId?doc(G.editId):null;
  $('prev').innerHTML=listo?(ed?rutaHTML({...armar(G.pisos[0],ed.consec),edicion:(ed.edicion||0)+1}):G.pisos.map((p,i)=>rutaHTML(armar(p,S.consec+1+i))).join('')):`<p class="muted" style="margin:6px 0">Elige edificio y piso para ver el nombre con que se guardará.</p>`;
  const b=$('btnGen');b.disabled=!listo;
  b.textContent=ed?'💾 Guardar edición':`✅ Generar${G.pisos.length>1?` ${G.pisos.length} bitácoras`:''}`;
}
function escribirOtro(v){
  const n=normEd(v);G.ed=n||null;
  document.querySelectorAll('.letra.ed').forEach(b=>b.classList.toggle('on',b.textContent===n));
  const nuevo=n&&!C().edificios.includes(n);
  $('otroBox').classList.toggle('on',!!nuevo);$('otroAdd').style.display=nuevo?'':'none';
  pintarPrev();
}
function agregarEd(){const n=G.ed;if(!n||C().edificios.includes(n))return;C().edificios.push(n);save();render();toast(`Edificio ${n} agregado a la lista ✔`)}
function movSem(n){G.lunes=toISO(addDays(parseISO(G.lunes),n));render()}
function togPiso(p){
  if(G.editId){G.pisos=[p];return render()}
  G.pisos=G.pisos.includes(p)?G.pisos.filter(x=>x!==p):[...G.pisos,p];G.pisos.sort((a,b)=>C().pisos.indexOf(a)-C().pisos.indexOf(b));render()
}
function armar(piso,consec){
  const c=C(),lun=parseISO(G.lunes),folio='BIT-SAN-'+pad(consec,4);
  return{id:folio,folio,consec,edicion:0,edificio:G.ed,piso,semana:isoWeek(lun).w,lunes:G.lunes,viernes:toISO(addDays(lun,4)),mesCarpeta:mesCarpeta(lun),creada:new Date().toISOString(),
    encabezado:c.encabezado,encMat:c.encMat,encVes:c.encVes,supervisor:c.supervisor,rubros:c.rubros.map(x=>[...x]),hoja2:c.hoja2,insumos:c.insumos.map(x=>[...x]),filasOtro:c.filasOtro,filasInc:c.filasInc};
}
function generar(){
  const sel={lunes:G.lunes,ed:G.ed,pisos:[...G.pisos]};
  const nuevos=G.pisos.map((p,i)=>armar(p,S.consec+1+i));
  S.consec+=nuevos.length;S.docs.push(...nuevos);save();
  G.pisos=[];render();
  abrirModal(nuevos,nuevos.length===1?'Bitácora generada':`${nuevos.length} bitácoras generadas`,()=>{
    const ids=nuevos.map(d=>d.id);S.docs=S.docs.filter(d=>!ids.includes(d.id));
    if(S.consec===nuevos[nuevos.length-1].consec)S.consec-=nuevos.length;
    save();G={...nuevoG(),...sel};ir('generar');toast('Cancelada. Corrige y vuelve a generar.');
  });
}
function editar(id){const d=doc(id);G={lunes:d.lunes,ed:d.edificio,pisos:[d.piso],editId:id};ir('generar')}
function guardarEdicion(){
  const d=doc(G.editId),antes=structuredClone(d),idx=S.docs.indexOf(d);
  const n={...armar(G.pisos[0],d.consec),creada:d.creada,edicion:(d.edicion||0)+1,editada:new Date().toISOString()};
  S.docs[idx]=n;save();G=null;ir('registro');
  abrirModal([n],`${n.folio} editada`,()=>{S.docs[S.docs.findIndex(x=>x.id===n.id)]=antes;save();render();toast('Edición cancelada; quedó la versión anterior.')});
}

let M=null;

    <p class="small muted" style="text-align:center;margin:0 0 8px">Ya quedó en el registro. Guárdala${n>1?'s':''} en esta carpeta y con este nombre:</p>

      <button class="abtn verde" onclick="guardarPDF(M.docs)"><span>💾</span><b>Guardar en el equipo</b></button>
      <button class="abtn blanco" onclick="cerrarModal()"><span>✔</span><b>Terminar</b></button>
    </div>

function cancelarModal(){

    <div class="caja w"><small>SEMANA</small><b>${d.semana}</b><span>del lunes ${fmt(d.lunes).slice(0,5)} al viernes ${fmt(d.viernes)}</span></div></div>`;
}
function hojas(d){
  const rub=d.rubros,tot=d.hoja2?2:1,enc=esc(d.encabezado||'MANTENIMIENTO');

  const h1=`<div class="hj">${membrete(d,enc,'BITÁCORA DE SANITARIOS',`HOJA 1 DE ${tot}`)}
    <table class="tb"><colgroup><col style="width:20mm"><col style="width:11.5mm">${rub.map(()=>'<col style="width:8.5mm"><col style="width:8.5mm">').join('')}<col><col style="width:36mm"></colgroup>
    <tr><th rowspan="2">DÍA</th><th rowspan="2">TURNO</th>${rub.map(([r,b])=>`<th colspan="2" class="rb ${b?'cp':''}">${esc(r.toUpperCase()).split(' ').join('<br>')}</th>`).join('')}<th rowspan="2">OBSERVACIONES</th><th rowspan="2">RÚBRICA<br>SUPERVISOR</th></tr>
    <tr>${rub.map(([,b])=>`<th class="${b?'cp':''}">SI</th><th class="${b?'cp':''}">NO</th>`).join('')}</tr>${filas}</table>
    ${rub.some(r=>r[1])?`<div class="ley">Columnas sombreadas = insumos que se compran. Si marcas NO, ${d.hoja2?'anota en la hoja 2 qué falta.':'anota en observaciones qué falta.'}</div>`:''}
    <div class="fr"><span>ENCARGADO DEL ÁREA MATUTINO</span><i>${esc(d.encMat)}</i><span>ENCARGADO DEL ÁREA VESPERTINO</span><i>${esc(d.encVes)}</i><span>SUPERVISIÓN</span><i>${esc(d.supervisor)}</i></div></div>`;
  if(!d.hoja2)return [h1];
  const ban=['Hombres','Mujeres'].map(x=>`<span class="chk"></span>${x}`).join('');
  const nOtro=d.filasOtro??5,nInc=d.filasInc??5;
  const ins=[...(d.insumos||[]).map(([n,u])=>`<b>${esc(n)}</b>${u?` <span style="color:#555">(${esc(u)})</span>`:''}`),...Array(nOtro).fill('')].map(n=>`<tr><td>${n}</td><td class="q"></td><td style="white-space:nowrap">${ban}</td><td></td></tr>`).join('');
  const inc=Array.from({length:nInc},()=>`<tr><td></td><td></td><td style="white-space:nowrap">${['Alto','Medio','Bajo'].map(x=>`<span class="chk"></span>${x}`).join('')}</td></tr>`).join('');
  const h2=`<div class="hj">${membrete(d,`${enc} · BITÁCORA DE SANITARIOS`,'¿QUÉ FALTA Y QUÉ PASÓ?',`HOJA 2 DE 2`)}
    <div class="h2sec cp">🛒 LO QUE FALTA <small>— anota la cantidad. En los renglones vacíos escribe lo que no esté en la lista.</small></div>
    <table class="t2"><colgroup><col style="width:34%"><col style="width:16%"><col style="width:22%"><col></colgroup><tr><th>¿QUÉ FALTA?</th><th>¿CUÁNTO?</th><th>¿EN QUÉ BAÑO?</th><th>OBSERVACIÓN</th></tr>${ins}</table>
    <div class="h2sec">⚠️ INCIDENTES Y REPARACIONES <small>— fugas, piezas rotas, piso mojado, falta de luz, etc.</small></div>
    <table class="t2"><colgroup><col style="width:56%"><col style="width:16%"><col></colgroup><tr><th>¿QUÉ PASÓ Y DÓNDE?</th><th>DÍA</th><th>RIESGO</th></tr>${inc}</table></div>`;
  return [h1,h2];
}
function imprimir(docs){
  $('print').innerHTML=docs.flatMap(hojas).join('');
  const t=document.title;document.title=docs.length===1?archivo(docs[0]).replace('.pdf',''):`BITACORAS_${toISO(new Date())}`;
  setTimeout(()=>{window.print();document.title=t},250);
}
async function guardarPDF(docs){
  if(!window.html2pdf){toast('No cargó el generador de PDF (¿sin internet?). Usa Imprimir → “Guardar como PDF”.',5000);imprimir(docs);return}
  toast('Generando PDF…',8000);
  for(const d of docs){
    const zona=$('pdfzone');zona.innerHTML='<div style="background:#fff">'+hojas(d).join('<div class="html2pdf__page-break"></div>')+'</div>';
    await html2pdf().set({margin:9,filename:archivo(d),image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'letter',orientation:'landscape'},pagebreak:{mode:['legacy']}}).from(zona.firstElementChild).save();
    zona.innerHTML='';
  }
  toast(docs.length>1?`${docs.length} PDF descargados ✔`:'PDF descargado ✔');
}

function guardarConfig(){
  const lista=(id,f)=>[...new Set($(id).value.split(',').map(f).filter(Boolean))];
  const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  const ed=lista('c_ed',normEd),pi=lista('c_pi',s=>s.trim().toUpperCase().replace(/[^A-Z0-9]/g,''));
  const ru=lines('c_ru').map(l=>{const[a,...b]=l.split('|').map(s=>s.trim());return[a,/compra/i.test(b.join(''))]});
  const ins=lines('c_in').map(l=>{const[a,...b]=l.split('|').map(s=>s.trim());return[a,b.join(' ')]});
  const num=(id,min,def)=>{const n=parseInt($(id).value,10);return isNaN(n)?def:Math.max(min,Math.min(10,n))};
  if(!ed.length||!pi.length||!ru.length)return toast('Necesitas al menos un edificio, un piso y un rubro');
  Object.assign(S.config,{encMat:$('c_mat').value.trim(),encVes:$('c_ves').value.trim(),supervisor:$('c_sup').value.trim(),encabezado:$('c_enc').value.trim()||'MANTENIMIENTO',edificios:ed,pisos:pi,rubros:ru,insumos:ins,filasOtro:num('c_fo',0,5),filasInc:num('c_fi',1,5),hoja2:$('c_h2').checked});
  G=null;save();render();toast('Cambios guardados ✔');
}
function cargarLogo(k,file){if(!file)return;if(file.size>600000)return toast('La imagen pesa mucho; usa una menor a 600 KB');const r=new FileReader();r.onload=e=>{C()[k]=e.target.result;save();render();toast('Logo actualizado ✔')};r.readAsDataURL(file)}

/* ================= EXCEL / RESPALDO ================= */
function paquete(){return{app:'bitacora-sanitarios',version:4,exportado:new Date().toISOString(),data:{...S,dirty:false}}}
function marcar(){S.dirty=false;persist()}
function exportarExcel(){
  if(!window.XLSX)return toast('No cargó la librería de Excel (¿sin internet?). Usa el respaldo .json');
  const wb=XLSX.utils.book_new();
  const filas=S.docs.map(d=>({Folio:d.folio,Edición:d.edicion||'',Edificio:d.edificio,Piso:d.piso,Semana:d.semana,Del:fmt(d.lunes),Al:fmt(d.viernes),Generada:fmt(d.creada),Editada:d.editada?fmt(d.editada):'','Encargado matutino':d.encMat,'Encargado vespertino':d.encVes,Supervisión:d.supervisor,Carpeta:carpeta(d),Archivo:archivo(d)}));
  const ws=XLSX.utils.json_to_sheet(filas.length?filas:[{Folio:''}]);ws['!cols']=[14,8,9,6,8,11,11,11,11,22,22,22,46,40].map(w=>({wch:w}));
  const json=JSON.stringify(paquete()),ch=[['NO EDITAR · respaldo de la app Bitácora de Sanitarios']];for(let i=0;i<json.length;i+=30000)ch.push([json.slice(i,i+30000)]);
  XLSX.utils.book_append_sheet(wb,ws,'Registro');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ch),'_DATOS');
  XLSX.writeFile(wb,`BITACORAS-SANITARIOS_REGISTRO_${toISO(new Date())}.xlsx`);marcar();toast('Excel descargado ✔');
}
function exportarJSON(){const b=new Blob([JSON.stringify(paquete())],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`BITACORAS-SANITARIOS_REGISTRO_${toISO(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);marcar()}
function importar(file,tipo){
  if(!file)return;const r=new FileReader();
  r.onload=e=>{try{
    let p;
    if(tipo==='xlsx'){if(!window.XLSX)throw 0;const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets['_DATOS'];if(!ws)throw 0;p=JSON.parse(XLSX.utils.sheet_to_json(ws,{header:1}).slice(1).map(x=>x[0]||'').join(''))}
    else p=JSON.parse(e.target.result);
    if(p.app!=='bitacora-sanitarios'||!Array.isArray(p.data?.docs))throw 0;
    if(!confirm(`El respaldo trae ${p.data.docs.length} bitácora(s) (del ${fmt(p.exportado)}). Reemplazará lo que hay en este navegador. ¿Continuar?`))return;
    localStorage.setItem(KEY,JSON.stringify(p.data));S=load();S.dirty=false;G=null;persist();render();toast('Registro cargado ✔');
  }catch(err){toast('Ese archivo no es un respaldo válido de esta app')}};
  tipo==='xlsx'?r.readAsArrayBuffer(file):r.readAsText(file);
}
function borrarTodo(){if(!confirm('¿Borrar TODO el registro y la configuración de este navegador? Descarga antes tu Excel.'))return;if(prompt('Escribe BORRAR para confirmar')!=='BORRAR')return;localStorage.removeItem(KEY);S=load();G=null;render()}

window.addEventListener('beforeunload',e=>{if(S.dirty&&S.docs.length){e.preventDefault();e.returnValue=''}});
render();
</script>
